# No `cooldown:` here on purpose. Since 2026-07-14 Dependabot applies a 3-day
# default cooldown to version updates on every ecosystem, with no config —
# setting `default-days: 2` would SHORTEN it. Only set this key to ask for
# longer than 3 days. Security updates are exempt and still open immediately.
version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
          - "*"

  # GitHub Actions
  # Grouped so Dependabot opens ONE PR per run. Sibling PRs that both edit
  # workflows can't auto-merge: after the first merges, GITHUB_TOKEN can't
  # merge the stale second one (workflow_policy_update_error).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
