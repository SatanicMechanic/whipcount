name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate script imports and syntax
        run: |
          python3 -c "
          import ast
          ast.parse(open('analyze_votes.py').read())
          print('Syntax OK')
          import requests
          print(f'requests {requests.__version__} OK')
          "

      - name: Run self-check
        run: python3 tests/test_scoring.py
