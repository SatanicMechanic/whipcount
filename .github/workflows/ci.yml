name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'   # the browser check drives Chrome over node's built-in WebSocket

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Validate script imports and syntax
        run: |
          python3 -c "
          import ast
          ast.parse(open('analyze_votes.py').read())
          print('Syntax OK')
          import requests
          print(f'requests {requests.__version__} OK')
          "

      - name: Run self-check
        run: python3 tests/test_scoring.py

      # No dependencies for either: the site check stubs the DOM, and the browser
      # check drives the Chrome that ubuntu-latest already ships.
      - name: Run site self-check
        run: node tests/test_site.mjs

      - name: Run browser self-check
        run: node tests/test_browser.mjs
