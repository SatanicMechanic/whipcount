name: Auto-merge Dependabot PRs

on:
  pull_request:
    branches: [main]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    needs: []  # will be gated by CI check passing via branch protection
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Policy: currency over stability. Every Dependabot update, majors included,
      # merges once the required `validate` check passes. No semver gate on purpose.
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
