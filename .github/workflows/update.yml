name: Update Voting Index

on:
  schedule:
    - cron: '50 7 * * 1'   # Every Monday at 7:50am UTC
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write      # to report upstream schema drift

    steps:
      # First step so it instruments the whole job — contents:write, unattended,
      # weekly, and the only job in this repo with no egress visibility (F19).
      # Audit, not block: no captured telemetry for this job yet (analyze_votes.py
      # hits Voteview, test_browser.mjs drives Chrome — unknown domains today).
      # Promote to block once a real run's log gives the actual list, the way
      # sync-upstream.yml did.
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # docs/history/ is tracked on main, so the checkout already carries every
      # prior snapshot forward. The script globs that dir to rebuild index.json.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # --require-hashes, no fallback: this job carries contents: write and
      # executes what it installs, unattended, every Monday. A hash mismatch
      # means the artifact on the index is not the one we locked — that must
      # fail the run, not get retried unverified. Regenerate deliberately with
      # `uv pip compile requirements.in --generate-hashes --python-version 3.11
      # -o requirements.txt`, never by loosening this flag.
      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'   # the browser check drives Chrome over node's built-in WebSocket

      # The browser check gates the publish: this job force-pushes the site with
      # nobody watching, so "it renders" has to be proven here or not at all.
      - name: Self-check
        run: |
          python3 tests/test_scoring.py
          node tests/test_site.mjs
          node tests/test_browser.mjs

      - name: Run scoring script
        run: python3 analyze_votes.py

      # Voteview can change its files under us. analyze_votes.py writes
      # schema-drift.txt when it sees a column or value it doesn't recognise —
      # and deletes it on a clean run, so a fixed problem stops nagging. Runs on
      # failure too: a dropped column stops the build and still writes a report.
      - name: Report upstream schema drift
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s schema-drift.txt ] || exit 0
          title="Voteview schema drift"
          # The report quotes upstream values (bionames, chamber and party codes).
          # A backtick in one would close the fence early and let the rest render as
          # markdown, posted as this project. Strip them; nothing else is markdown
          # inside a fence, and mentions in a code block do not notify.
          drift=$(tr -d '`' < schema-drift.txt)
          body=$(printf 'The weekly build saw upstream data it did not expect.\n\n```\n%s\n```\n\n[Run log](%s/%s/actions/runs/%s)' \
                 "$drift" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      # Snapshots are the one output that cannot be regenerated, so they get
      # real history on main. Bulk data (data.json, members/) is gitignored.
      - name: Commit history snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/history
          if git diff --staged --quiet; then
            echo "No snapshot change"
          else
            git commit -m "History snapshot $(date -u '+%Y-%m-%d')"
            git pull --rebase --autostash
            git push
          fi

      # docs/ is the whole published site. Force-pushed as a fresh single commit
      # so regenerated bulk data never accumulates anywhere.
      - name: Publish site branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs
          git init -q -b site
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build $(date -u '+%Y-%m-%d')"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f -q origin site
          echo "Pushed $(git ls-files | wc -l) files to site branch"
